name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: core-api · Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit + integration)
        env:
          JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/trackly_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-reports
          path: services/core-api/target/surefire-reports
          retention-days: 7

  insights:
    name: insights · Node + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/insights
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insights_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/insights/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (unit + integration)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/insights_test
        run: npm test
      - run: npm run build

  web:
    name: web · React + Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build (PWA)
        run: npm run build
      - name: Mobile build (Capacitor web bundle)
        run: cp .env.mobile.example .env.mobile && npm run build:mobile

  e2e:
    name: e2e · Playwright on the full stack
    runs-on: ubuntu-latest
    needs: [core-api, insights, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trackly
      INSIGHTS_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            services/insights/package-lock.json
            apps/web/package-lock.json

      - name: Build core-api
        working-directory: services/core-api
        run: mvn -B -ntp -q -DskipTests package
      - name: Build insights
        working-directory: services/insights
        run: npm ci && npm run build
      - name: Build web and install the browser
        working-directory: apps/web
        run: npm ci && npm run build && npx playwright install --with-deps chromium

      - name: Start the stack
        run: |
          nohup java -jar services/core-api/target/core-api.jar > core.log 2>&1 &
          timeout 120 bash -c 'until curl -sf localhost:8080/actuator/health > /dev/null; do sleep 2; done'
          (cd services/insights && PORT=4000 nohup node dist/index.js > ../../insights.log 2>&1 &)
          timeout 60 bash -c 'until curl -sf localhost:4000/health > /dev/null; do sleep 1; done'
          (cd apps/web && nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../../web.log 2>&1 &)
          timeout 60 bash -c 'until curl -sf 127.0.0.1:4173 > /dev/null; do sleep 1; done'

      - name: Run end-to-end journeys (desktop + mobile)
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            core.log
            insights.log
            web.log
          retention-days: 7

  docker:
    name: Docker images + compose
    runs-on: ubuntu-latest
    needs: [core-api, insights, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build core-api image (with CDS training run)
        run: docker build -t trackly-core-api services/core-api
      - name: Build insights image
        run: docker build -t trackly-insights services/insights
      - name: Build web image (nginx)
        run: docker build -t trackly-web apps/web
