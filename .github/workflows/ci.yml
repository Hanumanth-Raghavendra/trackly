name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: core-api (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/trackly_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B -ntp verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: core-api-jar
          path: services/core-api/target/core-api.jar
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-reports
          path: services/core-api/target/surefire-reports
          retention-days: 7
