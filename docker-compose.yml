# The whole Trackly stack on your machine with one command:
#
#   docker compose up --build
#
# then open http://localhost:3000 (web), http://localhost:8080/swagger-ui.html (core API docs).
# Postgres is published on 5433 so it doesn't clash with a Postgres you already run on 5432.

name: trackly

x-shared-env: &shared-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/trackly
  # Local-only defaults. Real deployments generate these (see render.yaml).
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-service-token}
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,https://localhost,capacitor://localhost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackly"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build: ./services/core-api
    environment:
      <<: *shared-env
      INSIGHTS_URL: http://insights:4000
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  insights:
    build: ./services/insights
    environment:
      <<: *shared-env
      PORT: "4000"
      # Optional extras, all free: see docs/DEPLOY.md.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - core-api
      - insights

volumes:
  pgdata:
